# 每天推送时间 (24小时制 HH:MM，默认每天 08:00)
push_time: "08:00"

# 发送模式:
#   image - 优先发送长图（下载转 Base64 发送，失败自动降级为文字）
#   text  - 发送纯文本新闻简报
send_mode: "image"

# 多群广播时各群发送间隔秒数 (防风控)
broadcast_interval: 1.0

# 新闻数据 API 接口列表 (按顺序容灾重试，支持多源保障可用性)
