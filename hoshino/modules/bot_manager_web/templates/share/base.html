<!doctype html>
<html lang="zh-CN">
<head>
    <title>{% if title %}{{ title }} - {% endif %}HoshinoBot 控制台</title>
    {% include "share/imports.html" %}
    {% block imports %}{% endblock %}
</head>
<body>
<div class="sidebar-overlay"></div>
<div class="app-container">
    <!-- Clean Flat Sidebar -->
    <aside class="app-sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-title">HoshinoBot</span>
                <span class="brand-tag">Web Console</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-category">菜单导航</div>
            <a class="nav-link {% if request and (request.path == url_prefix or request.path == url_prefix + '/') %}active{% endif %}" href="{{ url_prefix }}/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>首页总览</span>
            </a>
            <a class="nav-link {% if request and '/group' in request.path %}active{% endif %}" href="{{ url_prefix }}/group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>按群管理</span>
            </a>
            <a class="nav-link {% if request and '/service' in request.path %}active{% endif %}" href="{{ url_prefix }}/service">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <span>按服务管理</span>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <div class="bot-status-pill">
                <span class="status-dot"></span>
                <span>Bot 在线</span>
            </div>
            <a href="{{ url_prefix }}/logout" class="logout-link" title="退出登录">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="app-main">
        <header class="app-header">
            <div class="header-left">
                <button type="button" class="menu-toggle" aria-label="Toggle Menu">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="breadcrumb-title">
                    {% block page_title %}{{ title or "管理面板" }}{% endblock %}
                </div>
            </div>

            <div class="header-right">
                <div class="admin-tag">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>管理员</span>
                </div>
                <a href="{{ url_prefix }}/logout" class="btn btn-secondary btn-sm" title="退出登录">退出</a>
            </div>
        </header>

        <main class="app-body">
            {% block main %}{% endblock %}
        </main>
    </div>
</div>

<div id="toast-container"></div>
{% block afterload %}{% endblock %}
</body>
</html>
