{% extends "share/base.html" %}
{% block page_title %}{{ article_title | default("服务管理") }}{% endblock %}
{% block main %}
<div class="card">
    {% if article_title %}
    <div class="card-header">
        <h3 class="card-title">{{ article_title }}</h3>
    </div>
    {% endif %}
    <div class="card-body">
        {% block article %}{% endblock %}
    </div>
</div>
{% endblock %}
