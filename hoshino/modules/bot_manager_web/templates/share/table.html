{% extends "share/base.html" %}
{% block page_title %}{{ msg | default("数据列表") }}{% endblock %}
{% block main %}
<div class="card">
    {% if msg %}
    <div class="card-header">
        <h3 class="card-title">{{ msg }}</h3>
    </div>
    {% endif %}
    <div class="card-body">
        {% block table %}{% endblock %}
    </div>
</div>
{% endblock %}
